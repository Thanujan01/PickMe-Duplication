name: Deploy to GitHub Pages

# Manual only.
#
# The automatic version failed: `actions/configure-pages` with
# `enablement: true` needs the workflow token to have `pages: write`, and new
# repositories default to read-only, so every push produced a failed run.
#
# To use this instead of `npm run deploy`, set
#   Settings -> Actions -> General -> Workflow permissions
#     -> "Read and write permissions"
# then run this workflow once from the Actions tab. After that, change the
# trigger below back to `push: branches: [main]` for deploy-on-push.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run lint

      # `enablement: true` turns GitHub Pages on for the repository if it is
      # not already, so this works with no clicking in Settings.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # DEPLOY_TARGET switches Vite's base to the project sub-path.
      # Values come from .env.production, which is committed on purpose -
      # see the comment at the top of that file.
      - name: Build
        run: npm run build:pages

      - name: Add SPA fallback and disable Jekyll
        run: |
          # GitHub Pages serves 404.html for any unknown path. Making it a copy
          # of index.html lets client-side routes like /rider and /admin work
          # on a hard refresh or a shared link.
          cp dist/index.html dist/404.html
          # Without this, Pages runs Jekyll and drops files beginning with "_".
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
