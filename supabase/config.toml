project_id = "ride-app"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:5173/reset-password"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
# Local development only. Turn confirmations ON for a production project, or
# keep them off and rely on phone verification - see README "Auth settings".
enable_confirmations = false

# Edge Functions.
# dispatch-tick and push-notify are called by machines, not signed-in users, so
# they verify a shared secret of their own instead of a JWT.
[functions.dispatch-tick]
verify_jwt = false

[functions.push-notify]
verify_jwt = false

# admin-create-rider must only ever run for a signed-in administrator.
[functions.admin-create-rider]
verify_jwt = true
